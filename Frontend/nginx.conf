server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same job as proxy.conf.json in development: the app calls /api on its own origin.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change, so they can be cached for a long time.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes such as /countries/SVN or /game fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
